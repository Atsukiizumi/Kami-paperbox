services:
  kami:
    build: .
    image: kami-paperbox:latest
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 8080
      # 默认开应用账号（邮箱密码登录，设置自动同步服务端）；要纯浏览形态改 "false"
      VITE_AUTH_ENABLED: "true"
      # KAMI_PROXY: http://host.docker.internal:7890
    volumes:
      - kami-data:/app/.data
    restart: unless-stopped

volumes:
  kami-data:
