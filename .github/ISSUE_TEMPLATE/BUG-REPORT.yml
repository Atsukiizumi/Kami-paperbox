name: "问题报告"
description: "坏了、显示不对、请求失败。按测试步骤写。"
title: "[问题] "
labels: [
  "bug"
]
body:
  - type: textarea
    id: summary
    attributes:
      label: "一句话"
      description: "别人扫一眼就能知道坏在哪"
      placeholder: "浏览页点 R-18 日会提示未登录 实际已经登录"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "严重程度"
      options:
        - "阻断"
        - "严重"
        - "一般"
        - "轻微"
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: "出现频率"
      options:
        - "必现"
        - "经常"
        - "偶发"
        - "只一次"
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: "图源"
      options:
        - "Pixiv"
        - "FANBOX"
        - "Yande"
        - "Konachan"
        - "Danbooru"
        - "搜图"
        - "纸匣或队列"
        - "设置或登录"
        - "不限"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "环境"
      description: "系统、浏览器、pnpm dev 或 Docker、大概版本"
      placeholder: "Windows 11 Chrome pnpm dev 0.8.26"
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: "登录"
      options:
        - "未登录"
        - "已登录 Pixiv"
        - "已登录 FANBOX"
        - "Pixiv 和 FANBOX"
        - "不清楚"
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: "前置"
      description: "点下去之前账号、过滤、代理、停在哪一页"
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: reprod
    attributes:
      label: "步骤"
      description: "从打开页面写起 一步一个动作"
      value: |
        1. 打开浏览页
        2. 
        3. 
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期望"
      placeholder: "拉到 Pixiv 的 R-18 日榜"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "实际"
      description: "看到什么、提示原文、状态码"
      placeholder: "toast 先在设置里添加 Pixiv 账号"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "截图或日志"
      description: "控制台、失败请求的 URL 和状态码。会按代码块排。"
      render: bash
    validations:
      required: false
