# node 版本对齐 Dockerfile（node:24 = Active LTS）；包管理统一 pnpm（TD-06）——
# pnpm/action-setup 按 package.json 的 packageManager 字段选版本，锁文件
# 只有 pnpm-lock.yaml。build 不需要 DATABASE_URL —— migrate.mjs 无连接时
# 自动跳过（PGLite 启动时自迁移）。action 版本均取「Node 24 运行时」
# 起始的大版本（pnpm v6 / buildx v4 / build-push v7），消 Node 20 弃用注解。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # 覆盖率观察（§6.3#5）：同一套测试只跑一遍，c8 顺带产出 coverage-summary。
      # 仅报告、不设阈值——数值只进日志，涨跌先观察一段再决定要不要门禁。
      - run: pnpm run test:coverage:ci
      - run: node -e "const t=require('./coverage/coverage-summary.json').total;console.log('[coverage] Statements:',t.statements.covered+'/'+t.statements.total,'('+t.statements.pct+'%)','| Branches:',t.branches.covered+'/'+t.branches.total,'('+t.branches.pct+'%)')"
      - run: pnpm run lint
      - run: pnpm run build

  # 只构建不推送：锁文件/.dockerignore/构建上下文类回归只有真实 docker build
  # 能抓到（2026-09-11 的 pnpm-lock.yaml 被 .dockerignore 排除即此类，verify
  # 四门禁全绿但 docker compose up --build 必挂）。GHA 缓存免密钥。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # E2E（M7）：关键路径打真实上游（yande 无需登录），抖动靠 retry=1 兜。
  # webServer 自起 dev server（auth 默认开启，spec 里注册临时账号过数据面闸）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
