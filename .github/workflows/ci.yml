# node 版本对齐 Dockerfile（node:22）；包管理统一 pnpm（TD-06）——
# pnpm/action-setup 按 package.json 的 packageManager 字段选版本，锁文件
# 只有 pnpm-lock.yaml。build 不需要 DATABASE_URL —— migrate.mjs 无连接时
# 自动跳过（PGLite 启动时自迁移）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build

  # 只构建不推送：锁文件/.dockerignore/构建上下文类回归只有真实 docker build
  # 能抓到（2026-09-11 的 pnpm-lock.yaml 被 .dockerignore 排除即此类，verify
  # 四门禁全绿但 docker compose up --build 必挂）。GHA 缓存免密钥。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
